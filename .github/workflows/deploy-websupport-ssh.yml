name: Deploy to Websupport via SSH
permissions:
  contents: read
  actions: read
on:
  push:
    branches: ["production"]

jobs:
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Copy .htaccess file to fix routing on Apache server
        run: |
          FILENAME=.htaccess
          cp "./server-config/$FILENAME" "./dist/$FILENAME"
          echo "$FILENAME file copied to production dist folder"

          cd dist
          echo "All Files in production dist folder:"
          ls -la
          cd ../

      - name: Upload build artifacts for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
  deploy:
    name: 🚀 Deploy to Websupport via SSH
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.HOSTING_SSH_HOST }}
      SSH_USER: ${{ vars.HOSTING_SSH_USER_LOGIN }}
      SSH_PORT: ${{ vars.HOSTING_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTING_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ vars.HOSTING_SSH_HOST_KEY }}
      REMOTE_ROOT: michalbeno.eu
      REMOTE_RELEASES_DIR: michalbeno.eu/.releases
      REMOTE_CURRENT_DIR: michalbeno.eu/web
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup SSH agent
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          ssh-add <(printf '%s\n' "$SSH_PRIVATE_KEY")
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Add SSH host key
        run: |
          set -euo pipefail
          if [ -n "${SSH_HOST_KEY:-}" ]; then
            echo "Using pinned SSH host key from vars."
            printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "⚠️ SSH_HOST_KEY not set; falling back to ssh-keyscan."
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Check remote paths
        run: |
          set -euo pipefail
          echo "🔍 Validating remote paths on $SSH_HOST..."
          ssh -o StrictHostKeyChecking=yes -T -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOSSH
          set -euo pipefail
          ROOT_DIR="\$HOME/$REMOTE_ROOT"
          RELEASES_DIR="\$HOME/$REMOTE_RELEASES_DIR"
          CURRENT_DIR="\$HOME/$REMOTE_CURRENT_DIR"

          if [ ! -d "\$ROOT_DIR" ]; then
            echo "Missing base directory: \$ROOT_DIR" >&2
            exit 1
          fi

          mkdir -p "\$RELEASES_DIR"
          ls -ld "\$ROOT_DIR" "\$RELEASES_DIR"
          ls -ld "\$CURRENT_DIR" || true
          echo "📟 Remote paths look good."
          EOSSH

      - name: Define release paths
        run: |
          set -euo pipefail
          release_name="release-$(date +%Y%m%d-%H%M%S)"
          echo "📦 Preparing release: $release_name"
          echo "RELEASE_NAME=$release_name" >> "$GITHUB_ENV"
          echo "RELEASE_PATH=~/$REMOTE_RELEASES_DIR/$release_name" >> "$GITHUB_ENV"
          echo "CURRENT_PATH=~/$REMOTE_CURRENT_DIR" >> "$GITHUB_ENV"

      - name: Upload build to new release
        run: |
          set -euo pipefail
          umask 022
          echo "🚀 Deploying WEB to release directory: $RELEASE_PATH"
          rsync -az \
            --delay-updates --delete-delay --chmod=F644,D755 \
            -e "ssh -o StrictHostKeyChecking=yes -T -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$RELEASE_PATH/"

      - name: Activate new release
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -T -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            REMOTE_ROOT="$REMOTE_ROOT" \
            REMOTE_RELEASES_DIR="$REMOTE_RELEASES_DIR" \
            REMOTE_CURRENT_DIR="$REMOTE_CURRENT_DIR" \
            RELEASE_NAME="$RELEASE_NAME" \
            bash -s <<'EOSSH'
          set -Eeuo pipefail

          umask 022
          ROOT_DIR="$HOME/$REMOTE_ROOT"
          RELEASES_DIR="$HOME/$REMOTE_RELEASES_DIR"
          LIVE_DIR="$HOME/$REMOTE_CURRENT_DIR"
          RELEASE_DIR="$RELEASES_DIR/$RELEASE_NAME"
          PREVIOUS_TARGET=""

          rollback() {
            echo "❌ Activation failed — attempting rollback…"
            if [ -n "$PREVIOUS_TARGET" ]; then
              rm -rf "$LIVE_DIR" || true
              ln -sfn "$PREVIOUS_TARGET" "$LIVE_DIR" || true
              echo "↩️  Rolled back to previous live target: $PREVIOUS_TARGET"
            fi
          }
          trap rollback ERR

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "❌ Missing release directory: $RELEASE_DIR" >&2
            exit 1
          fi

          if [ -L "$LIVE_DIR" ]; then
            PREVIOUS_TARGET="$(readlink -f "$LIVE_DIR")"
          elif [ -d "$LIVE_DIR" ]; then
            echo "❌ Current live path is a real directory (not a symlink): $LIVE_DIR"
            echo "   Remove or convert it to a symlink before deploying."
            exit 1
          fi

          ln -sfn "$RELEASE_DIR" "$LIVE_DIR"
          echo "Symlink updated to: $RELEASE_DIR"

          echo "🧹 Cleaning up old releases (keeping 5 latest)"
          cd "$RELEASES_DIR"
          to_prune="$(ls -1dt release-* 2>/dev/null | tail -n +6 || true)"
          if [ -n "$to_prune" ]; then
            echo "Pruning releases:"
            printf '%s\n' "$to_prune"
            printf '%s\n' "$to_prune" | xargs -r rm -rf
          else
            echo "Nothing to prune."
          fi

          trap - ERR
          echo "✅ Activation completed."
          EOSSH

      - name: Post-deploy sanity check
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -T -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOSSH
          set -euo pipefail

          echo "Release directory:"
          ls -ld $RELEASE_PATH

          echo "Release contents (top):"
          ls -la $RELEASE_PATH | head

          test -f $RELEASE_PATH/index.html

          echo "Current symlink target:"
          readlink -f $CURRENT_PATH
          
          echo "HTTP smoke test (production):"
          curl -I --fail --max-time 10 https://michalbeno.eu/ || { echo "Smoke test failed"; exit 1; }
          echo "🎉 Sanity check passed."
          EOSSH
